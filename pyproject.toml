[project]
name = "tieredcache"
version = "0.1.0"
description = "Multi-tier (SSD + HDD) LRU storage cache manager with I/O backpressure prioritization"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tieredcache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
